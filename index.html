function loop(){requestAnimationFrame(loop);if(anim){camera.position.lerp(anim.p,0.08);controls.target.lerp(anim.t,0.08);if(camera.position.distanceTo(anim.p)<0.01)anim=null;}controls.update();renderer.render(scene,camera);}
loop();
addEventListener('resize',()=>{renderer.setSize(W(),H());camera.aspect=W()/H();camera.updateProjectionMatrix();});
</script>
</body>
</html>
